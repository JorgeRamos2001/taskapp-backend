spring:
  application:
    name: task-app-backend
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskapp_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.taskapp: DEBUG
    org.hibernate.SQL: DEBUG

---
# ──────────────── Perfil: dev ────────────────
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.taskapp: DEBUG
    org.springframework.security: DEBUG

---
# ──────────────── Perfil: test ────────────────
spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    clean-disabled: false

logging:
  level:
    com.taskapp: INFO
    org.hibernate.SQL: WARN

---
# ──────────────── Perfil: prod ────────────────
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

logging:
  level:
    root: WARN
    com.taskapp: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}", "level":"%p", "thread":"%t", "logger":"%logger{36}", "message":"%m"}%n'